<!doctype html>
<html lang="en" class="theme-light">

<head>
    <meta charset="UTF-8" />
    <title>PathFinder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Import thư viện Leaflet CSS -->

    <!-- Import CSS tùy chỉnh -->
    <link rel="stylesheet" href="ui/css/styles.css" />
    <link rel="icon" type="image/png" href="ui/css/favicon.png" />

</head>

<body>
    <div id="appLayout">
        <div id="mapArea">
            <!-- Container cho bản đồ -->


            <div id="appHeader">
                <div class="place-search-container">
                    <span class="search-icon"><i class="fas fa-map-marker-alt"></i></span>
                    <input id="placeSearchInput" placeholder="Nhập tên địa điểm..." />
                    <button id="placeSearchButton">Tìm</button>
                </div>
                <div class="search-results-container" id="searchResults"></div>
            </div>
            <div class="theme-toggle-btn">
                <i class="fa fa-cogs"></i>
            </div>

            <div class="theme-dropdown">
                <button class="theme-selector" onclick="switchTheme('light')">
                    Light Mode
                </button>
                <button class="theme-selector" onclick="switchTheme('dark')">
                    Dark Mode
                </button>
                <button class="theme-selector" onclick="switchTheme('sunset')">
                    Sunset Mode
                </button>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel" id="control-panel">
            <!-- Panel Header với Toggle Switch -->
            <div class="panel-header">
                <!-- Toggle Guest/Admin -->
                <div class="toggle-switch">
                    <input type="checkbox" id="roleToggle" classi="toggle-input" />
                    <label for="roleToggle" class="toggle-slider"></label>
                </div>
            </div>

            <!-- Guest Controls - Phần điều khiển cho người dùng thông thường -->
            <div class="guest-controls" id="guestControls">
                <div class="panel-section">
                    <h5>BẢNG ĐIỀU KHIỂN

                    </h5>
                    <label class="algorithm-title">Chọn thuật toán:</label>

                    <!-- Giữ select ẩn để code JS cũ vẫn dùng được algorithmSelect.value -->
                    <select id="algorithmSelect" class="algorithm-select-hidden">
                        <option value="Dijkstra" selected>Dijkstra</option>
                        <option value="BFS">BFS</option>
                        <option value="DFS">DFS</option>
                        <option value="Iterative Deepening DFS">Iterative Deepening DFS</option>
                        <option value="Uniform Cost Search">Uniform Cost Search</option>
                    </select>

                    <div class="algorithm-radio-group">
                        <label class="algorithm-option">
                            <input type="radio" name="algorithmRadio" value="Dijkstra" checked />
                            <span>Dijkstra</span>
                        </label>

                        <label class="algorithm-option">
                            <input type="radio" name="algorithmRadio" value="BFS" />
                            <span>BFS</span>
                        </label>

                        <label class="algorithm-option">
                            <input type="radio" name="algorithmRadio" value="DFS" />
                            <span>DFS</span>
                        </label>

                        <label class="algorithm-option">
                            <input type="radio" name="algorithmRadio" value="Iterative Deepening DFS" />
                            <span>Iterative Deepening DFS</span>
                        </label>

                        <label class="algorithm-option">
                            <input type="radio" name="algorithmRadio" value="Uniform Cost Search" />
                            <span>Uniform Cost Search</span>
                        </label>
                    </div>
                    </select>
                    <button id="togglePaths" class="btn btn-primary">
                        Tìm đường đi<i></i>
                    </button>
                    <button id="guestResetButton" class="btn btn-danger">
                        Làm mới
                    </button>
                </div>
            </div>

            <!-- Admin Controls - Phần điều khiển cho admin -->
            <div class="admin-controls" id="adminControls">
                <div class="panel-section">
                    <h5>Quản lý đường đi</h5>

                    <div class="collapsible-group">
                        <button type="button" class="collapsible-trigger btn btn-info">
                            Quản lý Cấm đường
                        </button>
                        <div class="collapsible-content">
                            <div class="control-group">
                                <button id="banEdgeBtn" class="btn btn-warning">
                                    Bắt đầu cấm đường
                                </button>
                                <button id="restoreBanBtn" class="btn btn-success">
                                    Khôi phục đoạn vừa cấm
                                </button>
                            </div>
                            <div class="control-group">
                                <button id="placeObstacleBtn" class="btn btn-warning">
                                    Đặt vật cản
                                </button>
                                <div class="input-group">
                                    <label>Bán kính ảnh hưởng (m):
                                        <input type="number" id="obstacleRadius" value="50" min="10"
                                            max="200" />
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="collapsible-group">
                        <button type="button" class="collapsible-trigger btn btn-info">
                            Quản lý Tắc đường
                        </button>
                        <div class="collapsible-content">
                            <div class="control-group">
                                <button id="trafficBtn" class="btn btn-warning">
                                    Bắt đầu đánh dấu tắc đường
                                </button>
                                <div class="input-group">
                                    <label>Hệ số tắc:
                                        <input type="number" id="trafficLevel" value="1" min="1"
                                            max="3" />
                                    </label>
                                </div>
                                <button id="restoreTacBtn" class="btn btn-success">
                                    Khôi phục đoạn tắc
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="collapsible-group">
                        <button type="button" class="collapsible-trigger btn btn-info">
                            Quản lý Ngập lụt
                        </button>
                        <div class="collapsible-content">
                            <div class="control-group">
                                <button id="floodBtn" class="btn btn-warning">
                                    Bắt đầu đánh dấu ngập lụt
                                </button>
                                <div class="input-group">
                                    <label>Hệ số ngập lụt:
                                        <input type="number" id="floodLevel" value="1" min="1"
                                            max="3" />
                                    </label>
                                </div>
                                <button id="restoreFloodBtn" class="btn btn-success">
                                    Khôi phục đoạn ngập lụt
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="collapsible-group">
                        <button type="button" class="collapsible-trigger btn btn-info">
                            Quản lý Đường 1 chiều
                        </button>
                        <div class="collapsible-content">
                            <div class="control-group">
                                <button id="toggleOneWayEdgeModeBtn" class="btn btn-warning">
                                    Bật/Tắt chế độ Đường 1 chiều
                                </button>
                            </div>
                        </div>
                    </div>
                    <hr />
                    <button id="adminResetButton" class="btn btn-danger">
                        Làm mới tất cả
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import JavaScript Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <script src="data/fileJs/nodes_latlon.js"></script>
    <script src="data/fileJs/nodes.js"></script>

    <script src="data/fileJs/adj_list.js"></script>
    <script src="data/fileJs/adj_list_with_weights.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hiddenSelect = document.getElementById("algorithmSelect");
            const radioButtons = document.querySelectorAll(
                'input[name="algorithmRadio"]'
            );

            radioButtons.forEach(function(radio) {
                radio.addEventListener("change", function() {
                    if (radio.checked) {
                        hiddenSelect.value = radio.value;
                    }
                });
            });
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hiddenSelect = document.getElementById("algorithmSelect");
            const radioButtons = document.querySelectorAll(
                'input[name="algorithmRadio"]'
            );

            let currentAlgorithm = hiddenSelect.value;

            radioButtons.forEach(function(radio) {
                radio.addEventListener("change", function() {
                    if (!radio.checked) return;

                    const newAlgorithm = radio.value;

                    if (newAlgorithm === currentAlgorithm) return;

                    currentAlgorithm = newAlgorithm;
                    hiddenSelect.value = newAlgorithm;

                    // Tự tìm đường lại khi đổi thuật toán
                    const findPathButton = document.getElementById("togglePaths");

                    if (findPathButton) {
                        findPathButton.click();
                    }
                });
            });
        });
    </script>
    <!-- Import JavaScript tùy chỉnh -->
    <script src="ui/js/main.js"></script>
</body>

</html>
